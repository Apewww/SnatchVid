<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnatchVid</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --surface-hover: #f5f4f2;
    --border: #e6e5e3;
    --text: #222222;
    --text-secondary: #717171;
    --accent: #ff385c;
    --accent-hover: #e31c5f;
    --success: #008a05;
    --danger: #c13515;
    --radius: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 40px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header .logo {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .header p {
    font-size: 16px;
    color: var(--text-secondary);
  }

  /* Card */
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: var(--shadow);
  }

  /* Input */
  .input-wrap {
    position: relative;
    margin-bottom: 4px;
  }
  .input-wrap .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: var(--text-secondary);
  }
  .input-wrap input {
    width: 100%;
    background: var(--surface-hover);
    border: 2px solid transparent;
    border-radius: var(--radius);
    color: var(--text);
    padding: 14px 14px 14px 44px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,56,92,0.12);
  }
  .input-wrap input::placeholder { color: #b0b0b0; }

  .hint {
    font-size: 13px;
    color: var(--text-secondary);
    min-height: 20px;
    padding: 0 4px;
    margin-top: 4px;
  }

  /* Preview */
  .preview {
    margin-top: 20px;
    display: none;
    animation: slideUp 0.3s ease;
  }
  .preview.show { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .preview-card {
    background: var(--surface-hover);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .preview-card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
  }
  .preview-card .info {
    padding: 14px 16px;
  }
  .preview-card .platform-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .preview-card .platform-badge.yt { background: #ffeaea; color: #c13515; }
  .preview-card .platform-badge.tt { background: #e0faf9; color: #01a59a; }
  .preview-card .platform-badge.ig { background: #fce4ef; color: #c13515; }
  .preview-card h3 {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .preview-card .meta {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .chip:hover { border-color: #999; color: var(--text); }
  .chip.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,56,92,0.04);
  }

  /* Download Button */
  .btn-dl {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-dl:hover { background: var(--accent-hover); }
  .btn-dl:active { transform: scale(0.98); }
  .btn-dl:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Progress */
  .progress {
    margin-top: 12px;
    height: 4px;
    background: #eee;
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .progress.show { display: block; }
  .progress .bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: #fff;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #b0b0b0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ SnatchVid</div>
  <p>Simpan video favoritmu dari TikTok, Instagram, atau YouTube</p>
</div>

<div class="card">
  <div class="input-wrap">
    <span class="icon">🔗</span>
    <input id="url" type="text" placeholder="Tempel link video di sini…" autocomplete="off" spellcheck="false">
  </div>
  <div class="hint" id="hint"></div>

  <div class="preview" id="preview">
    <div class="preview-card">
      <img id="thumb" alt="">
      <div class="info">
        <span class="platform-badge" id="ptag">YouTube</span>
        <h3 id="title">Judul video</h3>
        <div class="meta" id="meta">Uploader · 0:00</div>
      </div>
    </div>

    <div class="options">
      <div class="option-group">
        <label>🎯 Kualitas</label>
        <div class="chip-row" id="qualityRow"></div>
      </div>
      <div class="option-group">
        <label>📦 Format</label>
        <div class="chip-row" id="formatRow"></div>
      </div>
      <div class="option-group" id="durGroup" style="display:none">
        <label>⏱ Durasi</label>
        <div class="chip-row" id="durRow"></div>
      </div>
    </div>

    <div class="progress" id="progress"><div class="bar" id="progressBar"></div></div>
    <button class="btn-dl" id="btnDownload">Download Sekarang</button>
  </div>
</div>

<footer>Dibuat dengan ❤️ oleh RaflyLabs</footer>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const PLATFORMS = { youtube:{name:'YouTube',cls:'yt'}, tiktok:{name:'TikTok',cls:'tt'}, instagram:{name:'Instagram',cls:'ig'} };
const FORMATS = { original:{label:'📁 Original'}, wa_status:{label:'📱 WhatsApp'}, mp3:{label:'🎵 Musik'} };
let cq='best', cf='original', cd='30', meta=null, state='idle';

function showToast(m,t='',ms=3000){const e=$('toast');e.textContent=m;e.className='toast show '+t;setTimeout(()=>e.className='toast',ms)}
function detectPlatform(u){if(/youtube\.com|youtu\.be/i.test(u))return'tiktok';if(/tiktok\.com/i.test(u))return'tiktok';if(/instagram\.com/i.test(u))return'instagram';return null}
function detectPlatformCorrect(u){if(/youtube\.com|youtu\.be/i.test(u))return'youtube';if(/tiktok\.com/i.test(u))return'tiktok';if(/instagram\.com/i.test(u))return'instagram';return null}

const urlInput=$('url');
urlInput.addEventListener('input',()=>{
  const p=detectPlatformCorrect(urlInput.value.trim());
  const h=$('hint');
  if(p){const c=PLATFORMS[p];h.innerHTML=`<span style="color:var(--accent)">${c.name} terdeteksi ✓</span>`}
  else if(urlInput.value.trim()){h.textContent='Link belum dikenali'}
  else{h.textContent=''}
});
urlInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&state==='idle')fetchInfo()});

async function fetchJSON(u,r=3){let e;for(let i=0;i<r;i++){try{const r=await fetch(u);const b=await r.json().catch()=>({}));if(!r.ok)throw new Error(b.detail||`HTTP ${r.status}`);return b}catch(x){e=x;if(i<r-1)await new Promise(r=>setTimeout(r,1500*(i+1)))}}throw e}

function renderQuality(m){
  const row=$('qualityRow');row.innerHTML='';
  const qs=m.formats?.length?m.formats.map(f=>f.height):['best'];
  cq=qs[0]?.toString()||'best';
  qs.forEach(q=>{const b=document.createElement('button');b.className='chip'+(q.toString()===cq?' active':'');b.textContent=q==='best'?'⭐ Best':q+'p';b.onclick=()=>{cq=q.toString();row.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')};row.appendChild(b)})
}
function renderFormats(){
  const row=$('formatRow');row.innerHTML='';
  Object.entries(FORMATS).forEach(([k,c])=>{const b=document.createElement('button');b.className='chip'+(k===cf?' active':'');b.textContent=c.label;b.onclick=()=>{cf=k;row.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('durGroup').style.display=k==='wa_status'?'':'none'};row.appendChild(b)});
  const dr=$('durRow');dr.innerHTML='';
  ['15','30','60'].forEach(d=>{const b=document.createElement('button');b.className='chip'+(d===cd?' active':'');b.textContent=d+' dtk';b.onclick=()=>{cd=d;dr.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')};dr.appendChild(b)})
}

async function fetchInfo(){
  const u=urlInput.value.trim();
  if(!u){showToast('Masukkan link video dulu','error');return}
  if(!detectPlatformCorrect(u)){showToast('Link tidak didukung','error');return}
  state='fetching';$('hint').textContent='Mengambil info…';
  try{
    meta=await fetchJSON('/api/info?url='+encodeURIComponent(u));
    const c=PLATFORMS[meta.platform];
    $('ptag').textContent=c.name;$('ptag').className='platform-badge '+c.cls;
    $('thumb').src=meta.thumbnail||'';$('title').textContent=meta.title||'(tanpa judul)';
    $('meta').textContent=[meta.uploader,meta.duration].filter(Boolean).join(' · ');
    renderQuality(meta);renderFormats();
    $('preview').classList.add('show');$('hint').textContent='';state='preview'
  }catch(e){showToast('Gagal: '+e.message,'error');$('hint').textContent='';state='idle'}
}

async function doDownload(){
  const u=urlInput.value.trim();const pb=$('progressBar');const p=$('progress');const b=$('btnDownload');
  state='downloading';b.disabled=true;b.innerHTML='<span class="spinner"></span>Memproses…';p.classList.add('show');pb.style.width='30%';
  try{
    const r=await fetch(`/api/download?url=${encodeURIComponent(u)}&quality=${cq}&output=${cf}&wa_duration=${cd}`);pb.style.width='70%';
    if(!r.ok){const b=await r.json().catch()=>({}));throw new Error(b.detail||`HTTP ${r.status}`)}
    pb.style.width='90%';const cd2=r.headers.get('Content-Disposition')||'';const m=cd2.match(/filename="?([^";]+)"?/);const fn=m?m[1]:'snatchvid.mp4';
    const blob=await r.blob();pb.style.width='100%';const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();URL.revokeObjectURL(a.href);
    showToast(`✓ ${(blob.size/1e6).toFixed(1)} MB berhasil diunduh`,'success')
  }catch(e){show('Gagal: '+e.message,'error')}finally{b.disabled=false;b.innerHTML='Download Sekarang';p.classList.remove('show');pb.style.width='0%';state='preview'}
}
$('btnDownload').onclick=doDownload;
fetch('/api/health').then(r=>r.json()).then(h=>{}).catch(()=>{});
</script>
</body>
</html>
